<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dominic VR - Sala Básica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info {
      position: fixed; top: 10px; left: 10px; z-index: 999;
      background: rgba(0,0,0,0.6); color: #fff; padding: 8px 14px;
      border-radius: 8px; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="info">Dominic VR — Sala Básica · clique em "Enter VR" no canto inferior direito</div>

  <a-scene background="color: #1a1a2e" shadow="type: pcfsoft">

    <!-- ===== ASSETS ===== -->
    <a-assets>
      <img id="floorTex" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
      <img id="floorNormal" src="https://cdn.aframe.io/test-assets/blender-cube/Cube_BaseColor.png">
      <!-- Slides de exemplo (troque pelos seus, na ordem que quiser) -->
      <img id="slide0" src="https://picsum.photos/seed/dominic1/1024/576" crossorigin="anonymous">
      <img id="slide1" src="https://picsum.photos/seed/dominic2/1024/576" crossorigin="anonymous">
      <img id="slide2" src="https://picsum.photos/seed/dominic3/1024/576" crossorigin="anonymous">
    </a-assets>

    <!-- ===== ILUMINAÇÃO (clima de auditório: ambiente fria + luz de palco âmbar) ===== -->
    <a-light type="ambient" color="#3d4468" intensity="0.45"></a-light>
    <a-light type="directional" color="#c9d4ff" intensity="0.35" position="-3 4 3" castShadow="true"></a-light>
    <!-- Spots de palco -->
    <a-light type="spot" color="#ffb877" intensity="1.4" position="-1.5 3.8 -1" angle="35" penumbra="0.5" target="#palcoAlvo"></a-light>
    <a-light type="spot" color="#ffb877" intensity="1.4" position="1.5 3.8 -1" angle="35" penumbra="0.5" target="#palcoAlvo"></a-light>
    <a-entity id="palcoAlvo" position="0 0.5 -2.5"></a-entity>
    <!-- Luz de acento atrás do painel, tipo "glow" -->
    <a-light type="point" color="#3aa8ff" intensity="0.6" position="0 2.3 -3.95"></a-light>

    <!-- ===== AUDITÓRIO (dimensões: 8m x 4m x 9m) ===== -->
    <!-- Chão com textura + leve brilho -->
    <a-plane rotation="-90 0 0" width="8" height="9" position="0 0 0.5"
             material="color: #23283f; src: #floorTex; repeat: 4 4; roughness: 0.65; metalness: 0.15"
             shadow="receive: true"></a-plane>

    <!-- Tapete central do corredor, guiando o olho até o palco -->
    <a-plane rotation="-90 0 0" width="1.4" height="6" position="0 0.01 -0.5" color="#3a2a4a" opacity="0.55"></a-plane>

    <!-- Teto -->
    <a-plane rotation="90 0 0" position="0 4 0.5" width="8" height="9" color="#14162a"></a-plane>

    <!-- Parede fundo curva simulada (painel central + 2 ângulos) -->
    <a-plane position="0 2 -4" width="6" height="4" color="#1c2038" material="roughness: 0.8"></a-plane>
    <a-plane position="-4.4 2 -3.3" rotation="0 35 0" width="3" height="4" color="#181b30"></a-plane>
    <a-plane position="4.4 2 -3.3" rotation="0 -35 0" width="3" height="4" color="#181b30"></a-plane>

    <!-- Parede frente -->
    <a-plane position="0 2 5" rotation="0 180 0" width="8" height="4" color="#1c2038"></a-plane>

    <!-- Parede esquerda -->
    <a-plane position="-4 2 0.5" rotation="0 90 0" width="9" height="4" color="#181b30"></a-plane>

    <!-- Parede direita -->
    <a-plane position="4 2 0.5" rotation="0 -90 0" width="9" height="4" color="#181b30"></a-plane>

    <!-- Faixa de luz decorativa no rodapé das paredes laterais -->
    <a-plane position="-3.98 0.1 0.5" rotation="0 90 0" width="9" height="0.08" color="#3aa8ff" material="shader: flat"></a-plane>
    <a-plane position="3.98 0.1 0.5" rotation="0 -90 0" width="9" height="0.08" color="#3aa8ff" material="shader: flat"></a-plane>

    <!-- ===== PALCO / TELA DE APRESENTAÇÃO ===== -->
    <!-- Plataforma elevada do palco -->
    <a-cylinder position="0 0.08 -2.3" radius="2.6" height="0.16" color="#181b30" shadow="receive: true"></a-cylinder>
    <a-cylinder position="0 0.16 -2.3" radius="2.6" height="0.02" color="#3aa8ff" material="shader: flat; opacity: 0.5"></a-cylinder>

    <!-- Moldura do painel com leve profundidade -->
    <a-box position="0 2.1 -3.94" width="3.5" height="2.15" depth="0.1" color="#0c0e1c" metalness="0.3" roughness="0.6"></a-box>
    <a-box position="0 2.1 -3.88" width="3.3" height="1.95" depth="0.02" color="#05060c"></a-box>

    <!-- Tela do slide (a textura é trocada via JS) -->
    <a-plane id="slideScreen" position="0 2.1 -3.86" width="3" height="1.7"
             material="src: #slide0; shader: flat"></a-plane>

    <!-- Contador de slide -->
    <a-text id="slideCounter" value="1 / 3" position="1.35 1.05 -3.84" color="#6fd3ff"
             width="2.2" align="right"></a-text>

    <!-- Botão VOLTAR (clicável com laser do Quest) -->
    <a-entity id="btnPrev" position="-1.9 1.05 -3.6"
              geometry="primitive: plane; width: 0.55; height: 0.3"
              material="color: #1c2038; shader: flat"
              text="value: < ANTERIOR; align: center; width: 1.5; color: #cfe0ff"
              class="clickable"></a-entity>

    <!-- Botão AVANÇAR (clicável com laser do Quest) -->
    <a-entity id="btnNext" position="1.9 1.05 -3.6"
              geometry="primitive: plane; width: 0.55; height: 0.3"
              material="color: #1c2038; shader: flat"
              text="value: PRÓXIMO >; align: center; width: 1.5; color: #cfe0ff"
              class="clickable"></a-entity>

    <!-- Nome do evento acima do painel -->
    <a-text value="DOMINIC TALKS" position="-0.85 3.35 -3.9" color="#6fd3ff" width="5" letter-spacing="2"></a-text>

    <!-- Pódio com leve gradiente de cor e brilho -->
    <a-box position="0 0.5 -1.9" width="0.55" height="1" depth="0.4" color="#242850" shadow="cast: true"></a-box>
    <a-box position="0 0.98 -1.9" width="0.6" height="0.05" depth="0.42" color="#3aa8ff" material="shader: flat"></a-box>

    <!-- ===== ASSENTOS (fileira simples de referência) ===== -->
    <a-entity id="cadeiras"></a-entity>

    <!-- ===== PONTO DE ENTRADA DO USUÁRIO (câmera) ===== -->
    <a-entity id="rig" position="0 0 2.5" movement-controls>
      <a-entity camera position="0 1.6 0" look-controls wasd-controls raycaster="objects: .clickable" cursor="rayOrigin: mouse; fuse: false"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    // Gera cadeiras em fileiras com corredor central, estilo auditório
    const cadeirasContainer = document.querySelector('#cadeiras');
    const linhas = 4;
    const colunasPorLado = 3;
    const corredorGap = 0.9; // vão livre no centro
    const corAssento = '#2e3350';
    const corEncosto = '#3d4470';

    for (let l = 0; l < linhas; l++) {
      const z = 1.6 + l * 1.15;
      ['esq', 'dir'].forEach(lado => {
        for (let c = 0; c < colunasPorLado; c++) {
          const offset = corredorGap / 2 + c * 0.65;
          const x = lado === 'esq' ? -offset : offset;

          const cadeira = document.createElement('a-entity');
          cadeira.setAttribute('position', `${x} 0 ${z}`);

          const assento = document.createElement('a-box');
          assento.setAttribute('position', '0 0.25 0');
          assento.setAttribute('width', '0.5');
          assento.setAttribute('height', '0.08');
          assento.setAttribute('depth', '0.5');
          assento.setAttribute('color', corAssento);
          assento.setAttribute('shadow', 'cast: true');

          const encosto = document.createElement('a-box');
          encosto.setAttribute('position', '0 0.55 -0.22');
          encosto.setAttribute('width', '0.5');
          encosto.setAttribute('height', '0.55');
          encosto.setAttribute('depth', '0.08');
          encosto.setAttribute('color', corEncosto);
          encosto.setAttribute('shadow', 'cast: true');

          cadeira.appendChild(assento);
          cadeira.appendChild(encosto);
          cadeirasContainer.appendChild(cadeira);
        }
      });
    }

    // ===== SISTEMA DE SLIDES =====
    // Para adicionar mais slides: coloque as imagens em <a-assets> (id="slide3", "slide4"...)
    // e aumente o array abaixo na mesma ordem.
    const slideIds = ['#slide0', '#slide1', '#slide2'];
    let currentSlide = 0;

    const screen = document.querySelector('#slideScreen');
    const counter = document.querySelector('#slideCounter');

    function renderSlide() {
      screen.setAttribute('material', 'src', slideIds[currentSlide]);
      counter.setAttribute('value', `${currentSlide + 1} / ${slideIds.length}`);
    }

    function nextSlide() {
      currentSlide = Math.min(currentSlide + 1, slideIds.length - 1);
      renderSlide();
    }

    function prevSlide() {
      currentSlide = Math.max(currentSlide - 1, 0);
      renderSlide();
    }

    // Clique/laser nos botões (funciona com mouse no desktop e controle no Quest)
    document.querySelector('#btnNext').addEventListener('click', nextSlide);
    document.querySelector('#btnPrev').addEventListener('click', prevSlide);

    // Feedback visual simples ao passar o cursor/laser
    ['#btnNext', '#btnPrev'].forEach(sel => {
      const el = document.querySelector(sel);
      el.addEventListener('mouseenter', () => el.setAttribute('material', 'color', '#00d4ff'));
      el.addEventListener('mouseleave', () => el.setAttribute('material', 'color', '#2b2b45'));
    });

    // Navegação também pelo teclado (útil pra testar no desktop antes de ir pro Quest)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide();
  </script>
</body>
</html>
